<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Learn With Rayna Audio</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:#111827}main{max-width:820px;margin:auto;padding:20px 16px 80px}.top{background:#111827;color:white;padding:22px;border-radius:22px;margin-bottom:16px}h1{margin:0 0 6px;font-size:28px}.sub{opacity:.85;line-height:1.45}.status{margin:14px 0 0;padding:12px 14px;background:#fff;color:#111827;border-radius:14px;font-weight:700}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.tab{border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;background:#e5e7eb}.tab.active{background:#111827;color:white}.player{background:white;border-radius:22px;padding:18px;box-shadow:0 4px 20px #00000012}.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}h2{margin:5px 0 8px;font-size:23px}.meta{color:#6b7280;margin-bottom:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.ctrl{border:0;border-radius:15px;padding:15px 10px;font-size:16px;font-weight:800;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}.speed{margin-top:12px;display:flex;align-items:center;gap:10px}.speed input{flex:1}.lessons{margin-top:18px;display:grid;gap:10px}.lesson{width:100%;text-align:left;border:1px solid #e5e7eb;background:white;border-radius:16px;padding:14px 15px;font-size:15px;line-height:1.35}.lesson strong{display:block;font-size:16px;margin-bottom:3px}.lesson.current{border:2px solid #111827;background:#f9fafb}.note{margin-top:16px;padding:13px;border-radius:14px;background:#eef2ff;line-height:1.45;font-size:14px}</style></head>
<body><main><section class="top"><h1>🎧 Learn With Rayna</h1><div class="sub">ELA + Social Studies • test-night audio lessons</div><div class="status" id="status">Tap a lesson, then tap ▶ Play.</div></section><div class="tabs"><button class="tab active" id="tabELA">📚 ELA</button><button class="tab" id="tabSS">🏺 Social Studies</button></div><section class="player"><div class="kicker" id="subjectLabel">ELA</div><h2 id="title"></h2><div class="meta" id="meta"></div><div class="controls"><button class="ctrl" id="play">▶ Play</button><button class="ctrl secondary" id="pause">⏸ Pause</button><button class="ctrl secondary" id="resume">▶ Resume</button><button class="ctrl secondary" id="restart">↺ Restart Lesson</button></div><div class="speed"><span>Speed</span><input id="speed" type="range" min=".72" max="1.18" step=".02" value=".90"><b id="speedVal">0.90×</b></div><div class="lessons" id="lessons"></div><div class="note">Uses the device's built-in speech voice and speaks in short chunks for iPhone/iPad reliability. Keep this page open while listening.</div></section></main>
<script>
const DATA={"ELA":[["1 • All Summer in a Day — Story & Conflict","Ray Bradbury's All Summer in a Day uses an extreme setting to create conflict. On Venus, rain dominates life and the sun appears only briefly after a very long interval. Margot is different because she lived on Earth and remembers the sun. Most of the other children do not truly remember it. Her memory gives her something the others desperately want but cannot share. Their jealousy and resentment build until they lock Margot away just before the sun appears. The children then experience the sun for themselves. Only after the rain returns do they remember Margot. That ending matters because their own experience gives them a new understanding of what they took from her. When Riley analyzes the story, she should connect setting to mood, mood to character behavior, character behavior to conflict, and the ending to theme."],["2 • Setting, Character, Evidence & Theme","A strong setting answer does more than name Venus. The constant rain, darkness, confinement, and absence of sunlight create an oppressive mood. The brief appearance of the sun creates sharp contrast and changes the children's emotional experience. For character questions, use what a character says, does, thinks, and how the character changes. Evidence is the specific story detail. Reasoning explains how that detail supports the claim. Remember that jealousy is a topic, not a complete theme. A theme is a message about a topic. One defensible theme is that jealousy and exclusion can cause people to harm others and later confront the consequences. Riley should support any theme with specific events and explain the connection."],["3 • Figurative Language — KMU Level","The goal is not merely to label simile, metaphor, personification, or hyperbole. Riley must explain the effect. If a writer says the wind clawed at the shutters, clawed gives the wind an aggressive human-like action and strengthens a threatening mood. Use this sequence: name the device, picture what the language suggests, then explain its effect on meaning, imagery, mood, or tone. On a harder question, the answer may never ask for the device by name. It may ask what the description makes the reader feel or understand. That is why effect matters more than simple identification."],["4 • Dialogue & Punctuation — FNT Level","Dialogue must do a job. It can reveal character, create conflict, move action forward, or provide important information. For punctuation, spoken words live inside quotation marks. If the tag follows a statement, the comma stays with the spoken words before the closing quotation mark. If the tag comes first, a comma introduces the spoken words. A question keeps its question mark inside the quotation marks. When the speaker changes, start a new paragraph. For an interrupted sentence, commas surround the speaker tag and the continuing clause begins lowercase. If words after the quotation describe an action rather than speech, end the spoken sentence and begin a new sentence for the action."],["5 • ELA Final Retrieval for Tomorrow","Before the quiz, retrieve these ideas without notes. Why does Margot's memory matter? It separates her from the other children and helps drive the conflict. Why is the ending important? After experiencing the sun, the children can understand what Margot lost and must confront what they did. What is the difference between topic and theme? A topic is an idea; a theme is a message about that idea. What comes after identifying figurative language? Explain its effect. What makes dialogue purposeful? It reveals character, creates conflict, moves action, or provides needed information. What are the mechanics? Quotation marks around speech, correct punctuation with speaker tags, and a new paragraph when the speaker changes. For analysis, use claim, evidence, and reasoning rather than plot summary alone."]],"SS":[["1 • Geography: Fertile Crescent, Rivers & Silt","Mesopotamia means land between the rivers. The two rivers are the Tigris and Euphrates. Much of ancient Mesopotamia lies in modern Iraq within the broader Fertile Crescent, and the rivers flow toward the Persian Gulf. River water mattered for people, crops, transportation, and trade. Floodwaters could deposit silt, fine material that helped enrich soil. Remember the relationship, not just the vocabulary: rivers provided opportunities for farming, but people still had to manage water. Major Mesopotamian cities were developing by about 3500 B C E. Classroom nicknames include Land Between Two Rivers and Cradle of Civilization."],["2 • Irrigation, Agriculture & Civilization","Mesopotamians built irrigation systems, including canals and other water-control structures, to direct water to crops. Productive agriculture could create a food surplus, meaning more food than was immediately needed. Surplus allowed larger permanent settlements and helped free some people from farming full time. That supported job specialization, or division of labor. The cause-and-effect chain is crucial: rivers and silt, then irrigation and agriculture, then food surplus, then larger settlements and cities, then specialization, trade, government, writing, technology, and organized religion."],["3 • Sumer, City-States, Writing & Cuneiform","Sumer was one of the earliest major civilizations in Mesopotamia. Sumer was organized into city-states: a city and its surrounding territory functioning as an independent political unit. Sumerians used mud and clay bricks because those materials were available. Early pictographs developed into cuneiform, wedge-shaped writing pressed into clay with a stylus. Writing was not just an artistic invention. Growing cities, trade, goods, property, and government created increasing needs for records and administration. Clay tablets could preserve economic, legal, religious, and literary information."],["4 • Religion, Ziggurats & Civilization Features","Mesopotamians were polytheistic, meaning they believed in many gods. Gods and goddesses were associated with forces of nature and areas of life. Ziggurats were large stepped temple structures connected to organized religion. Riley's civilization features include cities, government and law, writing, specialization, social systems, technology, and religion. Food supply supports the larger system. The memory line is Cities, Government and Law, Writing, Specialization, Social System, Technology, Religion. The point is to recognize these features in examples, not just recite the list."],["5 • Technology: Plow, Wheel, Irrigation & Metallurgy","Technology means tools, systems, and techniques used to solve problems. Agricultural advances included irrigation and the plow. The wheel improved transportation and movement of goods. Metallurgy means working and processing metals to create useful objects. Bronze was an important material. Technology connects to the economy: improved agriculture can increase surplus; surplus can support trade and specialized workers; transportation can move goods; recordkeeping can track exchanges. On a difficult question, expect to explain what an invention changed rather than simply name it."],["6 • Sargon, Empires & Political Change","Sargon is associated with the Akkadian Empire. His importance is that he conquered Sumerian city-states and brought multiple territories under centralized rule. That helps show the shift from independent city-states toward empire. An empire controls multiple peoples or territories under broader political authority. Keep the classroom sequence in mind: Sumerian city-states, Akkadian, Old Babylonian, Assyrian, Neo-Babylonian, and Persian. Sargon anchors Akkadian. Hammurabi anchors Old Babylonian. Ashurbanipal anchors Assyrian. Nebuchadnezzar the Second anchors Neo-Babylonian. Cyrus the Great anchors Persian."],["7 • Hammurabi, Law & Social Structure","Hammurabi is associated with Babylon and a famous written collection of laws. The traditional classroom number is 282 laws. A common trap is to assume that a written code meant everyone received identical treatment. Riley's study guide expects the opposite: punishments could vary according to social status and circumstances. Written law is evidence of organized government, but it does not mean equality in the modern sense. If a question asks why a law code matters, connect it to governing a larger society through known rules and consequences."],["8 • Final 40-Item Retrieval Map","Final retrieval. Fertile Crescent: fertile region of Southwest Asia. Modern country: Iraq. Mesopotamia: land between the rivers. Rivers: Tigris and Euphrates. Destination: Persian Gulf. Silt: fine material deposited by water. Irrigation: controlled movement of water for agriculture. Sumer: early Mesopotamian civilization. City-state: independent city and surrounding territory. Pictographs: picture symbols. Cuneiform: wedge-shaped writing. Stylus: writing tool. Ziggurat: stepped temple structure. Polytheism: belief in many gods. Sargon: Akkadian Empire. Hammurabi: Babylon and law code. Traditional law count: 282. Paleolithic: earlier Stone Age associated mainly with hunting and gathering. Neolithic: later Stone Age associated with farming and permanent settlements. Food surplus: more food than immediately needed. Metallurgy: working with metals. Job specialization: different people doing different kinds of work. Civilization chain: river geography creates opportunities; irrigation improves agriculture; surplus supports cities and specialization; larger societies increase needs for government, writing, trade, technology, and organized religion."]]};let subject="ELA",idx=0,queue=[],qi=0,paused=false,speaking=false,currentUtter=null;const $=id=>document.getElementById(id);
function splitText(t){return t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)?.map(x=>x.trim()).filter(Boolean)||[t]}
function render(){$("subjectLabel").textContent=subject==="ELA"?"ELA":"SOCIAL STUDIES";const arr=DATA[subject],item=arr[idx];$("title").textContent=item[0];$("meta").textContent=(idx+1)+" of "+arr.length;$("lessons").innerHTML=arr.map((x,i)=>'<button class="lesson '+(i===idx?'current':'')+'" data-i="'+i+'"><strong>'+x[0]+'</strong>Tap to select</button>').join("");[...document.querySelectorAll(".lesson")].forEach(b=>b.onclick=()=>{stop();idx=+b.dataset.i;render();});$("tabELA").classList.toggle("active",subject==="ELA");$("tabSS").classList.toggle("active",subject==="SS")}
function chooseVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/Samantha|Ava|Allison|Susan|Karen|Moira/i.test(v.name)&&/^en/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
function speakNext(){if(paused||qi>=queue.length){if(qi>=queue.length){speaking=false;$("status").textContent="✓ Lesson complete. Choose another lesson or restart."}return}const u=new SpeechSynthesisUtterance(queue[qi]);currentUtter=u;u.rate=parseFloat($("speed").value);u.pitch=1;const v=chooseVoice();if(v)u.voice=v;u.onend=()=>{if(!paused){qi++;setTimeout(speakNext,80)}};u.onerror=()=>{speaking=false;$("status").textContent="Audio stopped. Tap Restart Lesson, then Play."};speechSynthesis.speak(u)}
function play(){if(!("speechSynthesis" in window)){$("status").textContent="Open this page in Safari to use audio.";return}if(!speaking){queue=splitText(DATA[subject][idx][1]);qi=0;speaking=true;paused=false;speechSynthesis.cancel();setTimeout(speakNext,100)}else if(paused){resume()}$("status").textContent="▶ Playing: "+DATA[subject][idx][0]}
function pause(){if(speaking){paused=true;speechSynthesis.pause();$("status").textContent="⏸ Paused"}}
function resume(){if(speaking){paused=false;speechSynthesis.resume();$("status").textContent="▶ Playing";if(!speechSynthesis.speaking)setTimeout(speakNext,80)}}
function stop(){speechSynthesis.cancel();speaking=false;paused=false;queue=[];qi=0}
function restart(){stop();play()}
$("play").onclick=play;$("pause").onclick=pause;$("resume").onclick=resume;$("restart").onclick=restart;$("tabELA").onclick=()=>{stop();subject="ELA";idx=0;render()};$("tabSS").onclick=()=>{stop();subject="SS";idx=0;render()};$("speed").oninput=e=>{$("speedVal").textContent=(+e.target.value).toFixed(2)+"×"};window.addEventListener("pagehide",()=>speechSynthesis.cancel());if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};render();
</script></body></html>
