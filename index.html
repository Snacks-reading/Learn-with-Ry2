*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0,#18214b 0,#090d1b 42%);color:var(--ink);min-height:100vh}button,input,textarea,select{font:inherit}.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.3px;font-size:clamp(20px,3vw,30px)}.brand span{color:var(--gold)}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#0d1430;padding:7px 10px;border-radius:999px;color:var(--muted);font-size:13px}.card{background:linear-gradient(180deg,rgba(23,33,66,.96),rgba(13,19,42,.96));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}.hero{padding:28px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:8px 0 14px}.hero p{max-width:850px;color:var(--muted);font-size:17px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.path{min-height:190px;cursor:pointer;transition:.18s transform,.18s border-color}.path:hover{transform:translateY(-3px);border-color:var(--gold)}.path h2{font-size:28px;margin:6px 0}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:12px;color:var(--cyan)}.muted{color:var(--muted)}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--gold);color:#1a1730}.btn.secondary{background:#202b53;color:var(--ink);border:1px solid var(--line)}.btn.good{background:var(--green);color:#082414}.btn.danger{background:#3b2030;color:#ffdce2;border:1px solid #70344c}.btn.small{padding:7px 10px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.subject{cursor:pointer;min-height:120px}.subject:hover{border-color:var(--cyan)}.subject .emoji{font-size:30px}.subject h3{margin:8px 0 4px}.bar{height:9px;background:#0a1025;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0}.stagebar{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.stage{font-size:11px;padding:5px 7px;border-radius:999px;background:#0d1430;color:#8793b6;border:1px solid #26325a}.stage.done{color:#072718;background:var(--green);border-color:var(--green)}.stage.due{color:#281d00;background:var(--gold);border-color:var(--gold)}.lesson{margin:14px 0}.lesson h3{font-size:24px;margin:5px 0}.teach{font-size:16px;line-height:1.65;color:#edf1ff}.remember{border-left:4px solid var(--gold);background:#141c39;padding:12px 14px;border-radius:0 12px 12px 0;margin:12px 0}.source{font-size:12px;color:#9fb1df;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}.source a{color:#8ce4ff}.qbox{background:#0d1430;border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:12px}.qbox h4{margin:0 0 10px}.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border-radius:10px;background:#172142;border:1px solid #344473;color:var(--ink);cursor:pointer}.opt:hover{border-color:var(--cyan)}.opt.sel{outline:2px solid var(--gold)}.feedback{margin-top:9px;padding:10px;border-radius:10px;display:none}.feedback.ok{display:block;background:#113426;color:#bdf5d1}.feedback.no{display:block;background:#3b1f2a;color:#ffd4dc}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:#111a38;cursor:pointer}.chip.sel{background:#3d3560;border-color:var(--purple)}.classify{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bucket{min-height:110px;border:1px dashed #53628f;border-radius:14px;padding:10px}.bucket h5{margin:0 0 8px;color:var(--cyan)}.item{background:#202b53;border:1px solid #42517e;border-radius:10px;padding:8px;margin:6px 0;cursor:pointer}.timeline{display:flex;flex-wrap:wrap;gap:8px}.timeline .item{min-width:140px}.callout{padding:13px;border-radius:14px;background:#202445;border:1px solid #414d7d}.warn{border-color:#72566a;background:#2a1e31}.success{border-color:#3f765b;background:#142c26}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.sticky{position:sticky;top:12px;align-self:start}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap}.tab.active{background:var(--gold);color:#211a00}.parent-note{border-left:4px solid var(--purple);padding:10px 13px;background:#1b1936;border-radius:0 12px 12px 0}.coach{border:1px solid #534b80;background:#18162e;border-radius:14px;padding:13px;margin:10px 0}.coach .answer{display:none;margin-top:10px;color:#d8d1ff}.coach.open .answer{display:block}.coverage{width:100%;border-collapse:collapse;font-size:13px}.coverage th,.coverage td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.coverage th{color:var(--cyan)}textarea{width:100%;min-height:110px;background:#0b1128;border:1px solid #394873;color:var(--ink);border-radius:12px;padding:12px}.scoregrid{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}.scoregrid select{background:#0b1128;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}.hidden{display:none!important}.bigscore{font-size:42px;font-weight:900;color:var(--gold)}.notice{font-size:13px;color:#c4cdea}.mission{border:1px solid #6a5b29;background:linear-gradient(135deg,#2b2515,#171c35)}.mission h2{margin-top:3px}.due-list{display:grid;gap:8px}.due-row{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#10172f;border-radius:12px;padding:10px}.print-only{display:none}

<script>
const SOURCES={
 ss:{label:'Michigan Open Book + teacher Mesopotamia packet + TN alignment',links:[['Michigan Open Book Ch. 3','https://learnbps.bismarckschools.org/mod/book/tool/print/index.php?id=449048'],['TN Social Studies standards','https://www.tn.gov/education/districts/academic-standards/social-studies-standards.html.html']]},
 ela:{label:'Holt/McDougal All Summer in a Day + teacher Narrative Essay Elements + TN ELA',links:[['Holt/McDougal text packet','https://6thgradeodyssey.weebly.com/uploads/6/0/2/4/60240057/all_summer_in_a_day_text.pdf'],['Achieve the Core lesson','https://achievethecore.org/page/1698/all-summer-in-a-day'],['TN ELA standards','https://www.tn.gov/education/districts/academic-standards/english-language-arts-standards.html']]},
 science:{label:'Teacher 49-question Energy Test #2 guide + STEMscopedia/STEMscopes + TN 6.PS3.2',links:[['Public STEMscopes-linked unit guide','https://core-docs.s3.us-east-1.amazonaws.com/documents/asset/uploaded_file/4254/EISD/3796333/6th_Grade_Unit_4_Energy_Resources_and_Transformations_2021-2022.pdf'],['TN Science standards','https://www.tn.gov/content/dam/tn/stateboardofeducation/documents/standards/science/New%2010-28-22%20Science%20Standards.pdf']]},
 math:{label:'Teacher percent unit + TN Grade 6 ratio/percent support',links:[['TN Grade 6 Math support','https://www.tn.gov/content/dam/tn/education/standards/math/Standards_Support_grade_6_Mathematics.pdf'],['IXL Tennessee Grade 6','https://www.ixl.com/standards/tennessee/math/grade-6']]}
};
const SUBJECTS={
 ss:{name:'Social Studies',emoji:'🏺',focus:'Mesopotamia — geography, civilization, Sumer, social systems, religion, writing, empires',objectives:[
  {id:'ss_geo',title:'Geography → farming → civilization',teach:`Mesopotamia developed around the Tigris and Euphrates. Water made farming possible, but people still had to manage a dry environment and flooding. Irrigation moved water to fields. More reliable farming could create a food surplus. That supported permanent settlements and allowed some people to do work other than farming.`,remember:'Cause chain: water management → reliable farming → surplus → settlements → specialization → complex society.',source:'Michigan Open Book Ch. 3 + teacher map / From Nomads to Farmers',practice:{type:'mc',q:'Why did irrigation matter even though people lived near rivers?',opts:['It moved water to fields where crops needed it.','It made writing possible.','It ended all flooding.','It created mountains.'],ans:0,why:'The rivers were essential, but water still had to be managed and directed to crops.'},apply:'Explain how one geographic condition created both an opportunity and a problem for Mesopotamians.',transfer:'A new settlement has a river but dry farmland two miles away. What Mesopotamian solution would help, and why?'},
  {id:'ss_civ',title:'Seven characteristics of civilization',teach:`The source names seven characteristics: Cities; Government and Law; System of Writing; Specialization; Social System; Complex Technology; Organized Religion. These are features historians can use to describe how a society is organized and how complex it has become.`,remember:'Cow Girls Wear Short Skirts To Run → Cities, Government & Law, Writing, Specialization, Social System, Technology, Religion.',source:'Michigan Open Book Ch. 3, “What Makes a Civilization a Civilization?”',practice:{type:'multi',q:'Select the 3 characteristics from the source.',opts:['System of Writing','Specialization','Organized Religion','Ocean Navy'],ans:[0,1,2],why:'Writing, specialization, and organized religion are three of the seven.'},apply:'Give one Mesopotamian example for four of the seven characteristics.',transfer:'A newly discovered society has cities, laws, writing, specialized jobs, social levels, advanced tools, and organized worship. Use the framework to explain what historians could infer.'},
  {id:'ss_social',title:'Specialization vs. Social System',teach:`These are related but different. Specialization means people perform different kinds of work. A social system (social structure) organizes those jobs and people into social levels. In the Mesopotamian source, priests, kings, landowners, and government officials are at the top; merchants, artisans, farmers, and fishers are in the middle; enslaved people are at the bottom.`,remember:'Specialization = WHAT work people do. Social system = HOW jobs/people are arranged into levels.',source:'Michigan Open Book Ch. 3, “Social Systems”',practice:{type:'mc',q:'Which statement describes a social system rather than specialization?',opts:['A potter becomes highly skilled at making jars.','People are organized into higher, middle, and lower social levels.','A farmer uses a plow.','A scribe learns cuneiform.'],ans:1,why:'A social system is the organization of jobs and social levels.'},apply:'Place these in the source hierarchy: artisan, king, farmer, enslaved person, government official.',transfer:'Explain why a society can have specialization without every specialist having equal social status.'},
  {id:'ss_write',title:'Cuneiform, records, and government',teach:`Sumerian cuneiform developed from earlier pictographs into wedge-shaped writing impressed into clay. The source describes uses including trade records, administrative documents, literature, letters, prayers, religious works, and economic transactions. Written information made complex administration possible.`,remember:'Cuneiform = wedge-shaped writing on clay; think records + administration + communication.',source:'Michigan Open Book Ch. 3 + teacher cuneiform materials',practice:{type:'multi',q:'Select all uses of cuneiform supported by the source.',opts:['Trade records','Administrative documents','Literature and letters','Digital maps'],ans:[0,1,2],why:'The source explicitly lists trade, administration, literature, letters, religious works, and economic transactions.'},apply:'Why would a growing city-state need written records more than a small village?',transfer:'Imagine taxes, trade, and laws are handled only by memory. Identify two problems writing could reduce.'},
  {id:'ss_religion',title:'Religion, ziggurats, and city life',teach:`Organized religion deeply influenced Mesopotamian everyday life. City-states were associated with patron gods and goddesses, and ziggurats stood at city centers. Riley’s classroom sheet includes An/Anu, Enlil, Utu/Shamash, Nanna/Sin, Inanna/Ishtar, and Enki/Ea.`,remember:'Polytheism = belief in multiple gods. Ziggurat = stepped temple structure tied to city religious life.',source:'Michigan Open Book + classroom gods/goddesses sheet + Kids Discover materials',practice:{type:'mc',q:'What does polytheism mean in this unit?',opts:['Belief in one ruler','Belief in multiple gods','A type of irrigation','A writing system'],ans:1,why:'Mesopotamian religion involved multiple deities.'},apply:'Connect a ziggurat to both religion and the organization of a city-state.',transfer:'Why would religion influence government if people believed their city belonged to a patron deity?'},
  {id:'ss_empires',title:'From city-states to empires',teach:`Sumerian city-states were politically independent and often fought. Sargon’s Akkadian Empire conquered Sumerian city-states and centralized control. Hammurabi later ruled Babylon and used a written law code to help preserve order and unify his empire. Assyrians later became known for military power, including iron weapons and siege warfare. Riley’s carousel continues with Neo-Babylonian and Persian rule; Phoenicians are studied as influential traders and city-states, not as a Mesopotamian empire.`,remember:'Core chain: Sumerian city-states → Akkadian/Sargon → Babylonian/Hammurabi → Assyrian. Then extend with the classroom carousel.',source:'Michigan Open Book + teacher Empire Carousel',practice:{type:'order',q:'Put the core sequence in order.',items:['Assyrian','Sumerian city-states','Babylonian / Hammurabi','Akkadian / Sargon'],ans:['Sumerian city-states','Akkadian / Sargon','Babylonian / Hammurabi','Assyrian'],why:'This is the core historical sequence used in the unit.'},apply:'What changed politically when Sargon conquered independent city-states?',transfer:'Compare a city-state with an empire using territory, political control, and leadership.'}
 ]},
 ela:{name:'ELA',emoji:'📚',focus:'All Summer in a Day + Narrative Essay Elements + dialogue',objectives:[
  {id:'ela_setting',title:'Setting drives plot',teach:`The Holt/McDougal lesson explicitly asks students to analyze plot and setting. Bradbury’s imagined Venus has extreme, nearly continuous rain and only a rare appearance of the sun. That setting is not decoration: it creates the conditions for Margot’s isolation, the children’s obsession with the sun, and the central conflict.`,remember:'Setting answers where/when — but analysis asks: What does the setting CAUSE?',source:'Holt/McDougal All Summer in a Day pp. 66–75 + teacher newsletter',practice:{type:'mc',q:'Which is the strongest analysis of setting?',opts:['Venus is a planet.','The extreme weather creates the children’s longing for sun and intensifies Margot’s isolation.','The story has children in it.','Rain is water.'],ans:1,why:'Analysis explains how setting affects character, conflict, and plot.'},apply:'Explain one way the setting causes an event in the plot.',transfer:'If the sun appeared every week instead, predict one major way the conflict would weaken.'},
  {id:'ela_infer',title:'Inference, character, and evidence',teach:`The source teaches inference as combining clues from the story with what you know. Margot’s memories and behavior separate her from classmates. After the children experience the sun and remember Margot, Bradbury shows their reaction through slowed movement, avoidance, and silence rather than simply naming an emotion.`,remember:'Clue from text + what I know = inference. Then prove it with evidence.',source:'Holt/McDougal reading skill + after-reading questions',practice:{type:'mc',q:'Which response is an inference rather than a plot retell?',opts:['The children open the closet.','The children likely feel remorse because they avoid one another’s gaze and move slowly to release Margot.','It rains on Venus.','Margot came from Earth.'],ans:1,why:'It makes a supported conclusion from character behavior.'},apply:'Make one inference about the children near the ending and identify the behavior that supports it.',transfer:'Write a different character action that could show guilt without using the words guilty, sorry, or ashamed.'},
  {id:'ela_fig',title:'Figurative language, mood, and word choice',teach:`Bradbury uses comparisons and vivid descriptions to make Venus feel oppressive during the rain and extraordinary during the brief sunlight. The class is reviewing figurative language, but the important move is not merely naming a device — it is explaining its effect on mood, imagery, character experience, or meaning.`,remember:'Name it → quote/describe it → explain its EFFECT.',source:'Holt/McDougal text analysis + teacher figurative-language focus',practice:{type:'mc',q:'What turns identification into analysis?',opts:['Naming “metaphor” only','Explaining how the comparison shapes mood or meaning','Counting words','Copying the sentence twice'],ans:1,why:'Literary analysis explains the effect of the author’s choice.'},apply:'Choose one comparison from the story and explain what it helps the reader imagine or feel.',transfer:'Create a new figurative description of endless rain, then explain the mood it creates.'},
  {id:'ela_dialogue',title:'Dialogue punctuation + purpose',teach:`The Holt/McDougal grammar section teaches quotation marks around exact speech, commas with speaker tags, and punctuation inside quotation marks. Riley’s current narrative unit also asks a deeper question: dialogue should do work — reveal character, advance events, create tension, or show relationships.`,remember:'Correct punctuation + a reason for the line to exist.',source:'Holt/McDougal “Punctuate Dialogue Correctly” + teacher Narrative Essay Elements',practice:{type:'mc',q:'Choose the correctly punctuated sentence.',opts:['Maya said “I remember the sun.”','Maya said, “I remember the sun.”','Maya said, “I remember the sun”.','Maya said “I remember the sun”.'],ans:1,why:'A tag before dialogue takes a comma; the spoken sentence is inside quotation marks and its period stays inside.'},apply:'Write two lines of dialogue that reveal tension without saying “they were angry.”',transfer:'Revise one line of flat dialogue so it both reveals character and moves the scene forward.'},
  {id:'ela_narrative',title:'Narrative architecture',teach:`Tennessee’s grade-level narrative expectations and Riley’s teacher focus align on a coherent sequence: orient the reader with context and point of view; organize events logically; develop characters/events with dialogue, pacing, description, and details; use transitions; and craft an effective conclusion.`,remember:'Orient → develop → sequence → purposeful dialogue/details → effective ending.',source:'Teacher Narrative Essay Elements + Tennessee narrative-writing expectations',practice:{type:'multi',q:'Select the 3 moves that strengthen a narrative.',opts:['Orient the reader','Use dialogue to develop character/events','Craft an effective conclusion','Add unrelated facts'],ans:[0,1,2],why:'Those are core narrative-writing moves; unrelated facts weaken coherence.'},apply:'Outline a 5-beat scene: orientation, rising problem, turning point, reaction, ending.',transfer:'Write an ending that changes how the reader understands a character without explaining the lesson directly.'}
 ]},
 science:{name:'Science',emoji:'⚡',focus:'Heat Transfer + Energy Resources — teacher test map',objectives:[
  {id:'sci_modes',title:'Conduction, convection, radiation',teach:`Conduction transfers thermal energy through direct particle interactions/contact. Convection transfers energy through bulk motion of a fluid such as air or water. Radiation transfers energy by electromagnetic waves and can cross empty space. More than one mechanism can operate in the same real system.`,remember:'Contact = conduction. Circulating fluid = convection. EM waves/no matter required = radiation.',source:'Teacher Energy Test #2 guide + TN 6.PS3.2',practice:{type:'classify',q:'Classify each scenario.',items:[['Metal spoon warms in soup','Conduction'],['Warm water circulates in a pot','Convection'],['Sun warms your skin','Radiation'],['Hot door transfers energy to a hand','Conduction']],buckets:['Conduction','Convection','Radiation'],why:'Look for direct contact, fluid circulation, or electromagnetic transfer.'},apply:'Explain all thermal-transfer mechanisms that may occur around a pot heating on a stove.',transfer:'A heater warms a room. Explain why “the heater uses only one kind of heat transfer” can be an oversimplification.'},
  {id:'sci_equil',title:'Temperature, particles, equilibrium',teach:`When objects at different temperatures interact, energy transfers from the warmer object toward the cooler one until they reach thermal equilibrium. Temperature is related to average particle kinetic energy. “Heat rises” is incomplete language: in convection, warmer fluid often becomes less dense and rises relative to cooler, denser fluid under gravity.`,remember:'Warmer → cooler until equilibrium. In convection: density difference drives circulation.',source:'Teacher guide Q10, Q21, Q23, Q38–40 + TN science',practice:{type:'mc',q:'Two objects in contact have different temperatures. What happens?',opts:['Energy moves from cooler to warmer forever.','Energy transfers from warmer toward cooler until equilibrium.','Their temperatures never change.','Only radiation can occur.'],ans:1,why:'Thermal energy transfers because of the temperature difference until equilibrium.'},apply:'Explain why warm air near a ceiling is evidence of convection rather than “heat floating upward.”',transfer:'Predict what happens to circulation when a fluid is heated unevenly from below.'},
  {id:'sci_materials',title:'Conductors, insulators, and evidence',teach:`Conductors allow thermal energy to transfer more readily; metals such as copper and aluminum are common examples. Insulators slow transfer. Fiberglass insulation works in part by trapping air and reducing energy transfer. In experiments, measured temperature change is evidence — not merely a guess about what “feels hot.”`,remember:'Conductor = easier transfer. Insulator = slows transfer. Evidence = measured change.',source:'Teacher guide Q7–11, Q31, Q37 + class heat materials',practice:{type:'multi',q:'Select the 2 statements that are accurate.',opts:['Copper is a useful conductor.','Insulation can slow thermal transfer.','All liquids are perfect insulators.','Temperature evidence is unnecessary.'],ans:[0,1],why:'Copper conducts well; insulation reduces transfer.'},apply:'Why are metal pans useful for cooking while handles may use insulating materials?',transfer:'Design a fair comparison to test which of two cup materials slows thermal transfer better.'},
  {id:'sci_resources',title:'Renewable and nonrenewable resources',teach:`The classroom resource set includes biomass, geothermal, solar, hydropower, and wind as renewable resources, and coal and natural gas as nonrenewable. The STEMscopes-linked public guide also emphasizes researching advantages and disadvantages rather than memorizing “good” versus “bad.” Resource choice depends on availability, reliability, cost, environmental effects, and how the resource is obtained and used.`,remember:'Classify first. Then evaluate trade-offs.',source:'Teacher resource chart + STEMscopedia/STEMscopes-linked unit guide',practice:{type:'classify',q:'Classify the classroom resources.',items:[['Solar','Renewable'],['Wind','Renewable'],['Coal','Nonrenewable'],['Natural gas','Nonrenewable'],['Geothermal','Renewable'],['Hydropower','Renewable'],['Biomass','Renewable']],buckets:['Renewable','Nonrenewable'],why:'Renewables replenish on human-relevant timescales; fossil fuels do not.'},apply:'Compare wind and natural gas using one advantage and one disadvantage of each.',transfer:'A town needs dependable electricity but has weak wind and strong geothermal resources. What evidence should it gather before choosing?'},
  {id:'sci_path',title:'How resources become usable energy',teach:`Energy-resource questions are stronger when Riley can trace a process. Hydropower uses moving water to turn turbines connected to generators. Geothermal systems can use underground heat to produce steam that turns turbines. Natural gas is obtained by drilling, including hydraulic fracturing in some settings, then burned for energy. Solar photovoltaic panels convert radiant energy to electrical energy.`,remember:'Resource → process/device → energy transfer/transformation → useful output.',source:'Teacher resource chart + classroom slides + STEMscopes-linked guide',practice:{type:'order',q:'Order the geothermal electricity pathway.',items:['Generator produces electricity','Underground heat warms water','Steam turns turbine','Water becomes/makes steam'],ans:['Underground heat warms water','Water becomes/makes steam','Steam turns turbine','Generator produces electricity'],why:'Trace the physical process from heat source to electricity.'},apply:'Trace hydropower from moving water to electricity.',transfer:'Why is “renewable” not the same thing as “zero environmental impact”?'},
  {id:'sci_climate',title:'CO₂, greenhouse gases, and human activity',teach:`The teacher guide connects burning fossil fuels with increasing atmospheric carbon dioxide. Greenhouse gases absorb and re-emit infrared energy, affecting how thermal energy moves through the Earth system. Deforestation can also affect atmospheric CO₂ because fewer trees are available to take up carbon dioxide through photosynthesis, while land-use changes can release stored carbon.`,remember:'Fossil-fuel combustion adds CO₂; greenhouse gases affect outgoing infrared energy; deforestation can alter the carbon balance.',source:'Teacher Energy Resources study guide + current science context',practice:{type:'mc',q:'Which human activity in the teacher guide is most directly tied to increased CO₂?',opts:['Burning fossil fuels','Using a ruler','Freezing water','Reading a thermometer'],ans:0,why:'Combustion of fossil fuels releases carbon dioxide.'},apply:'Explain the greenhouse connection without saying greenhouse gases “make heat.”',transfer:'Explain two different ways a community’s energy choices could affect greenhouse-gas emissions.'}
 ]},
 math:{name:'Math',emoji:'📐',focus:'Ratios stay alive; percentages as ratios per 100',objectives:[
  {id:'math_ratio',title:'Ratio reasoning stays active',teach:`The class finished the ratio unit, but the teacher says ratios and proportional reasoning remain in review. A ratio compares quantities. Equivalent-ratio tables, tape diagrams, and double number lines help show multiplicative relationships rather than hiding them behind a shortcut.`,remember:'Ask: What two quantities are being compared? What stays proportional?',source:'Teacher newsletter + TN 6.RP.A.1–3',practice:{type:'mc',q:'A recipe uses 2 cups juice for every 3 cups water. Which ratio is equivalent?',opts:['4:6','4:5','3:2','6:4'],ans:0,why:'Multiplying both quantities by 2 preserves the ratio.'},apply:'Build a ratio table for 2:3 through four equivalent rows.',transfer:'Explain how you know 6:9 and 10:15 represent the same relationship without simplifying first.'},
  {id:'math_percent',title:'Percent means per 100',teach:`A percent is a special rate comparing a quantity to 100. 35% means 35 per 100, or 35/100. This connects the new percent unit directly to ratio reasoning.`,remember:'Percent = “per hundred.” Always identify the whole before interpreting a percent.',source:'Teacher percent unit + TN 6.RP.A.3c',practice:{type:'mc',q:'What does 42% mean?',opts:['42 out of 10','42 per 100','100 per 42','42 more than the whole'],ans:1,why:'Percent is a rate per 100.'},apply:'Show 25% as a fraction out of 100 and as an equivalent simplified fraction.',transfer:'Why can 25% of 80 be found by thinking “one fourth of 80”?'},
  {id:'math_part',title:'Find the part',teach:`When the percent and whole are known, the unknown is the PART. Example: 25% of 80 asks for a portion of a known whole. A bar model can divide the whole into useful equal pieces; a double number line can align 0–100% with 0–80.`,remember:'Percent + whole known → find PART.',source:'Teacher percent focus + TN support models',practice:{type:'mc',q:'30% of 70 is what number?',opts:['21','30','40','100'],ans:0,why:'30/100 × 70 = 21.'},apply:'Draw or describe a model showing why 25% of 80 = 20.',transfer:'A club has 120 members and 35% attend an event. Find the number attending and explain what each number represents.'},

const KEY='learnwithry_ry_github_v5';
const ARCHIVE_KEY='learnwithry_written_response_archive_v2';
const LEGACY_ARCHIVE_KEYS=['learnwithry_written_response_archive_v1'];
const BUILD_ID='2026-09-21-ry-github-v5-chatgpt-review';
const REVIEW_SCHEMA=2;
let state=loadState();
function loadState(){let s={done:{},practice:{},missed:[],retention:[],tests:{},writing:{},legacyImported:false};try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function uid(){try{return crypto.randomUUID()}catch(e){return 'wr_'+Date.now()+'_'+Math.random().toString(36).slice(2)}}
function loadArchive(){let rows=[];for(const k of [ARCHIVE_KEY,...LEGACY_ARCHIVE_KEYS]){try{let a=JSON.parse(localStorage.getItem(k)||'[]');if(a&&Array.isArray(a.records))a=a.records;if(Array.isArray(a))rows.push(...a)}catch(e){}}let seen=new Set();return rows.filter(r=>{let id=r.archiveId||r.fingerprint;if(!id||seen.has(id))return false;seen.add(id);return true}).map(normalizeRecord)}
function normalizeRecord(r){r.reviewHistory=Array.isArray(r.reviewHistory)?r.reviewHistory:[];r.review=r.review||{status:'awaiting_chatgpt'};if(r.review.status==='unreviewed')r.review.status='awaiting_chatgpt';if(r.review.reviewer==='Ray')r.review={status:'awaiting_chatgpt',legacyParentReview:r.review};r.reviewFramework=r.reviewFramework||reviewFrameworkFor(r.sub,r.objectiveId,r.stage,r.prompt);r.schema=REVIEW_SCHEMA;return r}
let WRITTEN_ARCHIVE=loadArchive();
function saveArchive(){try{localStorage.setItem(ARCHIVE_KEY,JSON.stringify(WRITTEN_ARCHIVE))}catch(e){}}
function objectiveTitle(sub,id){let o=(SUBJECTS[sub]?.objectives||[]).find(x=>x.id===id);return o?o.title:(id==='mastery'?'Mastery Check':id)}
function promptFor(sub,id,stage){let o=(SUBJECTS[sub]?.objectives||[]).find(x=>x.id===id);if(o&&o[stage])return o[stage];return stage||'Written response'}
function reviewFrameworkFor(sub,id,stage,prompt=''){let text=(prompt||'').toLowerCase();if(sub==='ela'&&(text.includes('multiple cohesive paragraphs')||text.includes('full narrative')||stage==='tcap_narrative'))return {type:'TN_TCAP_ELA_6_8',mode:'Narrative',score:'16-point holistic/trait rubric',standard:'6.W.TTP.3'};if(sub==='ela'&&(stage==='tcap_explanatory'))return {type:'TN_TCAP_ELA_6_8',mode:'Explanatory',score:'16-point holistic/trait rubric',standard:'6.W.TTP.2'};if(sub==='ela'&&(stage==='tcap_argument'))return {type:'TN_TCAP_ELA_6_8',mode:'Argument',score:'16-point holistic/trait rubric',standard:'6.W.TTP.1'};return {type:'TN_GRADE6_TASK_STANDARD',mode:sub==='ela'?'ELA constructed response':SUBJECTS[sub]?.name+' constructed response',score:'Task/standard-based review; do not force the full 16-point TCAP essay rubric',standard:'Verify current Tennessee grade-level standard at review time'} }
function archiveRecord({sub,id,stage,text,at,prompt,legacyKey,buildId}){if(!text||!String(text).trim())return null;let createdAt=Number(at)||Date.now(),fingerprint=[legacyKey||'',sub||'',id||'',stage||'',createdAt||'',String(text).trim()].join('|');let existing=WRITTEN_ARCHIVE.find(r=>r.fingerprint===fingerprint);if(existing)return existing;let exactPrompt=prompt||promptFor(sub,id,stage),rec={schema:REVIEW_SCHEMA,archiveId:uid(),fingerprint,student:'Ry',sub:sub||'unknown',objectiveId:id||'unknown',objectiveTitle:objectiveTitle(sub,id),stage:stage||'response',prompt:exactPrompt,text:String(text).trim(),createdAt,buildId:buildId||BUILD_ID,legacyKey:legacyKey||null,reviewFramework:reviewFrameworkFor(sub,id,stage,exactPrompt),review:{status:'awaiting_chatgpt',reviewer:null,reviewedAt:null},reviewHistory:[]};WRITTEN_ARCHIVE.push(rec);saveArchive();return rec}
function migrateWritingObject(writing,buildId,prefix){if(!writing||typeof writing!=='object')return 0;let n=0;Object.entries(writing).forEach(([k,v])=>{if(!v||typeof v!=='object'||typeof v.text!=='string'||!v.text.trim())return;let before=WRITTEN_ARCHIVE.length;archiveRecord({sub:v.sub,id:v.id,stage:v.stage,text:v.text,at:v.at,prompt:v.prompt,legacyKey:(prefix||'legacy')+':'+k,buildId:buildId||'legacy'});if(WRITTEN_ARCHIVE.length>before)n++});return n}
function migrateAllKnownWriting(){let n=0;try{n+=migrateWritingObject(state.writing,BUILD_ID,'current');for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||k===ARCHIVE_KEY||!(/learnwithry|lwr_/i.test(k)))continue;try{let obj=JSON.parse(localStorage.getItem(k)||'{}');if(obj&&obj.writing)n+=migrateWritingObject(obj.writing,k,k);if(obj&&obj.writtenResponses)n+=migrateWritingObject(obj.writtenResponses,k,k+':writtenResponses')}catch(e){}}}catch(e){}saveArchive();return n}
migrateAllKnownWriting();
function archiveStats(){let reviewed=WRITTEN_ARCHIVE.filter(r=>r.review?.status==='reviewed'&&r.review?.reviewer==='ChatGPT').length;return {total:WRITTEN_ARCHIVE.length,reviewed,awaiting:WRITTEN_ARCHIVE.length-reviewed}}
function downloadJSON(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportWrittenArchive(){downloadJSON({format:'Learn With Ry Written Response Archive',schema:REVIEW_SCHEMA,exportedAt:new Date().toISOString(),records:WRITTEN_ARCHIVE},'Learn_With_Ry_Written_Response_Archive.json')}
function exportReviewPacket(){let records=WRITTEN_ARCHIVE.filter(r=>!(r.review?.status==='reviewed'&&r.review?.reviewer==='ChatGPT'));if(!records.length){alert('There are no responses waiting for ChatGPT review.');return}downloadJSON({format:'Learn With Ry ChatGPT Review Packet',schema:REVIEW_SCHEMA,createdAt:new Date().toISOString(),reviewerRequired:'ChatGPT',instructions:'Review every response. Verify the current official Tennessee standard/rubric at review time. For a full Grade 6 ELA TCAP-style writing task, use the official Grades 6–8 rubric for the correct mode and preserve its 16-point structure. For shorter ELA, Math, Science, or Social Studies constructed responses, use the applicable current Tennessee grade-level standard and task expectations; do not falsely apply the full essay rubric. Return records with the same archiveId, review.status=reviewed, review.reviewer=ChatGPT, evidence-based feedback, next-step revision coaching, and scores only when the applicable Tennessee framework supports them.',records},'Learn_With_Ry_Send_To_ChatGPT.json')}
function importArchive(input,reviewOnly=false){let f=input.files&&input.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let obj=JSON.parse(rd.result),rows=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(rows))throw Error('No records array');let added=0,updated=0;rows.forEach(raw=>{if(!raw||!raw.text)return;let r=normalizeRecord(raw),ex=WRITTEN_ARCHIVE.find(x=>x.archiveId===r.archiveId||x.fingerprint===r.fingerprint);if(reviewOnly&&!(r.review?.status==='reviewed'&&r.review?.reviewer==='ChatGPT'))return;if(ex){if(reviewOnly){ex.reviewHistory??=[];if(ex.review?.status==='reviewed')ex.reviewHistory.push(ex.review);ex.review=r.review;ex.reviewFramework=r.reviewFramework||ex.reviewFramework;updated++}else if((r.review?.reviewedAt||0)>(ex.review?.reviewedAt||0)){Object.assign(ex,r);updated++}}else if(!reviewOnly){WRITTEN_ARCHIVE.push(r);added++}});saveArchive();alert(reviewOnly?`ChatGPT reviews imported: ${updated}.`:`Archive imported: ${added} added, ${updated} updated.`);renderReviewQueue()}catch(e){alert('That file is not a valid Learn With Ry archive/review file.')}};rd.readAsText(f)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const app=document.getElementById('app');let current={screen:'home',sub:null};

function subjectCards(){return `<div class="grid4">${Object.entries(SUBJECTS).map(([k,s])=>{let pct=progress(k);return `<div class="card subject" onclick="openRySub('${k}')"><div class="emoji">${s.emoji}</div><h3>${s.name}</h3><div class="muted">${s.focus}</div><div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div><small class="muted">${pct}% evidence complete</small></div>`}).join('')}</div>`}
function progress(sub){let objs=SUBJECTS[sub].objectives,points=0,total=objs.length*5+1;objs.forEach(o=>{let d=state.done[o.id]||{};['learn','remember','practice','apply','transfer'].forEach(x=>{if(d[x])points++})});let t=(state.tests[sub]||[]).slice(-1)[0];if(t&&t.autoPct>=80)points++;return Math.round(100*points/total)}
function dueRetention(){let now=Date.now();return state.retention.filter(r=>!r.done&&r.due<=now)}
function renderRy(){current={screen:'ry'};let due=dueRetention(),stats=archiveStats();app.innerHTML=headerHtml()+`<section class="card hero"><div class="eyebrow">Student path</div><h1>Learn. Remember. Explain. Transfer.</h1><p>Current teacher materials control what you learn. Practice helps you get ready; mastery records your first attempt. Written answers are preserved for ChatGPT to review against the applicable Tennessee expectations.</p><div class="toolbar"><button class="btn" onclick="renderReviewQueue()">✍️ ChatGPT Review Queue (${stats.awaiting})</button><button class="btn secondary" onclick="exportWrittenArchive()">Backup Writing Archive</button><label class="btn secondary" style="cursor:pointer">Restore Archive<input type="file" accept="application/json,.json" onchange="importArchive(this,false)" style="display:none"></label></div></section><section class="card mission"><div class="eyebrow">Today’s Mission</div><h2>${due.length?due.length+' retrieval item'+(due.length>1?'s':'')+' due':'Build durable memory'}</h2><p class="muted">Short retrieval first, then current lessons. Missed skills return in a different form.</p>${due.length?`<div class="due-list">${due.slice(0,6).map(r=>`<div class="due-row"><span>${SUBJECTS[r.sub].emoji} ${esc(r.title)}</span><button class="btn small" onclick="runRetention('${r.id}')">Retrieve</button></div>`).join('')}</div>`:`<div class="callout success">Nothing is due yet. Completing practice schedules a 2-day and 7-day retrieval.</div>`}</section><h2>Choose a subject</h2>${subjectCards()}`}

function objectiveCard(sub,o,i){let d=state.done[o.id]||{};return `<section class="card lesson"><div class="eyebrow">Objective ${i+1} of ${SUBJECTS[sub].objectives.length}</div><h3>${o.title}</h3><div class="stagebar">${['learn','remember','practice','apply','transfer'].map(x=>`<span class="stage ${d[x]?'done':''}">${x.toUpperCase()}</span>`).join('')}</div><div class="teach">${o.teach}</div><div class="remember"><b>Remember:</b> ${o.remember}</div><div class="toolbar"><button class="btn small ${d.learn?'good':''}" onclick="markStage('${o.id}','learn')">✓ Learned</button><button class="btn small ${d.remember?'good':''}" onclick="markStage('${o.id}','remember')">Memory Lock</button><button class="btn small ${d.practice?'good':''}" onclick="practice('${sub}','${o.id}')">Practice</button><button class="btn small ${d.apply?'good':''}" onclick="writeStage('${sub}','${o.id}','apply')">Apply</button><button class="btn small ${d.transfer?'good':''}" onclick="writeStage('${sub}','${o.id}','transfer')">Transfer</button></div><div id="work_${o.id}"></div><div class="source">Source: ${o.source}. ${sourceLinks(sub)}</div></section>`}
function sourceLinks(sub){return SOURCES[sub].links.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(' • ')}

function shuffled(opts,ans){let a=opts.map((v,i)=>({v,i}));for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return {opts:a.map(x=>x.v),correct:a.map(x=>x.i).reduce((r,orig,idx)=>{if(Array.isArray(ans)?ans.includes(orig):orig===ans)r.push(idx);return r},[])}}
function renderPractice(sub,o){let p=o.practice;if(p.type==='mc'||p.type==='multi'){let sh=shuffled(p.opts,p.ans),qid='q_'+o.id;return `<div class="qbox" data-correct="${sh.correct.join(',')}" data-type="${p.type}" id="${qid}"><h4>${p.q}</h4>${p.type==='multi'?'<div class="notice">Select the complete correct set.</div>':''}${sh.opts.map((x,i)=>`<button class="opt" onclick="pickOpt(this,'${qid}',${i})">${esc(x)}</button>`).join('')}<button class="btn small" onclick="checkPractice('${sub}','${o.id}','${qid}')">Check</button><div class="feedback" id="fb_${qid}"></div></div>`}if(p.type==='classify'){return `<div class="qbox" id="q_${o.id}"><h4>${p.q}</h4><p class="notice">Tap an item, then tap its bucket.</p><div class="chips" id="items_${o.id}">${p.items.map((x,i)=>`<span class="chip" data-answer="${x[1]}" data-i="${i}" onclick="selectItem(this)">${x[0]}</span>`).join('')}</div><div class="classify">${p.buckets.map(b=>`<div class="bucket" onclick="dropTo(this,'${o.id}','${b}')"><h5>${b}</h5></div>`).join('')}</div><button class="btn small" onclick="checkClassify('${sub}','${o.id}')">Check</button><div class="feedback" id="fb_q_${o.id}"></div></div>`}if(p.type==='order'){let items=[...p.items].sort(()=>Math.random()-.5);return `<div class="qbox" id="q_${o.id}"><h4>${p.q}</h4><p class="notice">Tap items in the correct order.</p><div class="chips" id="orderPool_${o.id}">${items.map(x=>`<span class="chip" onclick="addOrder(this,'${o.id}')">${x}</span>`).join('')}</div><div class="timeline" id="order_${o.id}"></div><button class="btn small" onclick="checkOrder('${sub}','${o.id}')">Check</button> <button class="btn small secondary" onclick="practice('${sub}','${o.id}')">Reset</button><div class="feedback" id="fb_q_${o.id}"></div></div>`}return ''}
function pickOpt(el,qid,i){let q=document.getElementById(qid),multi=q.dataset.type==='multi';if(!multi)[...q.querySelectorAll('.opt')].forEach(x=>x.classList.remove('sel'));el.classList.toggle('sel');el.dataset.pick=i}
function finishPractice(sub,o,ok,fb){fb.className='feedback '+(ok?'ok':'no');fb.style.display='block';fb.innerHTML=ok?`Correct. ${o.practice.why}`:`Not yet. ${o.practice.why}<br><b>This skill has been added to the comeback queue.</b>`;state.practice[o.id]??={tries:0,firstCorrect:null};state.practice[o.id].tries++;if(state.practice[o.id].firstCorrect===null)state.practice[o.id].firstCorrect=ok;if(ok){state.done[o.id]??={};state.done[o.id].practice=true;scheduleRetention(sub,o)}else{state.missed.push({sub,id:o.id,title:o.title,at:Date.now()})}save()}
function checkPractice(sub,id,qid){let o=obj(sub,id),q=document.getElementById(qid),correct=q.dataset.correct.split(',').filter(Boolean).map(Number),sel=[...q.querySelectorAll('.opt.sel')].map(x=>Number(x.dataset.pick));finishPractice(sub,o,sel.length===correct.length&&sel.every(x=>correct.includes(x)),document.getElementById('fb_'+qid))}
let selectedItem=null;function selectItem(el){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));selectedItem=el;el.classList.add('sel')}function dropTo(bucket,id,b){if(!selectedItem)return;selectedItem.dataset.chosen=b;selectedItem.classList.remove('sel');bucket.appendChild(selectedItem);selectedItem=null}

function scheduleRetention(sub,o){[2,7].forEach(days=>{let rid=o.id+'_'+days;if(!state.retention.some(x=>x.id===rid&&!x.done))state.retention.push({id:rid,sub,obj:o.id,title:o.title+' — '+days+' day retrieval',due:Date.now()+days*86400000,done:false})});save()}
function runRetention(rid){let r=state.retention.find(x=>x.id===rid),o=obj(r.sub,r.obj);current={screen:'retain',sub:r.sub};app.innerHTML=headerHtml()+`<div class="toolbar"><button class="btn secondary" onclick="renderRy()">← Mission</button></div><section class="card"><div class="eyebrow">Delayed Retrieval</div><h2>${o.title}</h2><p>Without looking back at the lesson, answer:</p><div class="qbox"><h4>${o.transfer}</h4><textarea id="retText"></textarea><button class="btn" onclick="finishRetention('${rid}')">Save for ChatGPT review</button></div></section>`}
function finishRetention(rid){let t=document.getElementById('retText').value.trim();if(t.length<15){alert('Give a complete retrieval response.');return}let r=state.retention.find(x=>x.id===rid),o=obj(r.sub,r.obj),at=Date.now();r.done=true;r.response=t;r.doneAt=at;archiveRecord({sub:r.sub,id:r.obj,stage:'delayed_retrieval',text:t,at,prompt:o.transfer,legacyKey:'retention:'+rid+':'+at,buildId:BUILD_ID});save();renderRy()}
function startMastery(sub){current={screen:'test',sub};let prepared=MASTERY[sub].map(q=>{if(q[0]==='mc'||q[0]==='multi'){let sh=shuffled(q[2],q[3]);return {type:q[0],q:q[1],opts:sh.opts,correct:sh.correct,skill:q[4]}}return {type:'text',q:q[1],skill:q[4]}});renderMastery(sub,prepared)}
function renderMastery(sub,qs){app.innerHTML=headerHtml()+`<div class="toolbar"><button class="btn secondary" onclick="openRySub('${sub}')">← ${SUBJECTS[sub].name}</button></div><section class="card"><div class="eyebrow">First-attempt evidence</div><h1>${SUBJECTS[sub].name} Mastery Check</h1><p class="muted">No instant answer feedback. Auto-scored items lock when submitted. Every written answer goes to the ChatGPT Review Queue.</p>${qs.map((q,i)=>`<div class="qbox testq" data-type="${q.type}" data-correct="${q.correct?q.correct.join(','):''}" data-skill="${esc(q.skill)}" data-prompt="${esc(q.q)}"><h4>${i+1}. ${q.q}</h4>${q.type==='text'?`<textarea id="testtext_${i}"></textarea>`:q.opts.map((x,j)=>`<button class="opt" onclick="pickTest(this,${i},${j},'${q.type}')">${esc(x)}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="submitMastery('${sub}')">Submit locked attempt</button></section>`}
function pickTest(el,i,j,type){let q=document.querySelectorAll('.testq')[i];if(type==='mc')[...q.querySelectorAll('.opt')].forEach(x=>x.classList.remove('sel'));el.classList.toggle('sel');el.dataset.pick=j}
function submitMastery(sub){let qs=[...document.querySelectorAll('.testq')],correct=0,total=0,missed=[],writing=[];for(let i=0;i<qs.length;i++){let q=qs[i],type=q.dataset.type;if(type==='text'){let t=document.getElementById('testtext_'+i).value.trim();if(t)writing.push({skill:q.dataset.skill,text:t,prompt:q.dataset.prompt});continue}total++;let ans=q.dataset.correct.split(',').filter(Boolean).map(Number),sel=[...q.querySelectorAll('.opt.sel')].map(x=>Number(x.dataset.pick)),ok=sel.length===ans.length&&sel.every(x=>ans.includes(x));if(ok)correct++;else missed.push(q.dataset.skill)}let attempt={at:Date.now(),correct,total,autoPct:total?Math.round(100*correct/total):0,missed,writing};state.tests[sub]??=[];state.tests[sub].push(attempt);writing.forEach((w,i)=>{let key=`mastery_${sub}_${attempt.at}_${i}`,entry={sub,id:'mastery',stage:w.skill,text:w.text,at:attempt.at,prompt:w.prompt};state.writing[key]=entry;archiveRecord({...entry,legacyKey:'current:'+key,buildId:BUILD_ID})});missed.forEach(skill=>state.missed.push({sub,id:'mastery',title:skill,at:Date.now()}));save();showResult(sub,attempt)}
function showResult(sub,a){app.innerHTML=headerHtml()+`<section class="card"><div class="eyebrow">Attempt saved permanently</div><div class="bigscore">${a.autoPct}%</div><h2>Auto-scored evidence</h2><p>${a.correct} of ${a.total} objective items correct on this attempt.</p><div class="callout ${a.autoPct>=80?'success':'warn'}">${a.autoPct>=80?'Auto-scored threshold met. Written responses still require ChatGPT review.':'Review the missed skills before another attempt.'}</div>${a.missed.length?`<p><b>Comeback skills:</b> ${a.missed.join(', ')}</p>`:''}<div class="toolbar"><button class="btn" onclick="openRySub('${sub}')">Back to subject</button><button class="btn secondary" onclick="renderReviewQueue('awaiting_chatgpt','${sub}')">Written Review Queue</button><button class="btn secondary" onclick="startMastery('${sub}')">New attempt</button></div></section>`}
function testHistory(sub){let arr=state.tests[sub]||[];if(!arr.length)return '<p class="muted">No mastery attempt yet.</p>';return arr.map((a,i)=>`<div class="callout" style="margin:8px 0"><b>Attempt ${i+1}</b> • ${new Date(a.at).toLocaleString()} • ${a.autoPct}% auto-scored • missed: ${a.missed.length?a.missed.join(', '):'none'}${a.writing.length?`<br><small>${a.writing.length} written response(s) preserved for ChatGPT review.</small>`:''}</div>`).join('')}
function renderReviewQueue(status='all',sub='all'){current={screen:'reviews'};migrateAllKnownWriting();let stats=archiveStats(),rows=WRITTEN_ARCHIVE.filter(r=>(status==='all'||(status==='reviewed'?(r.review?.status==='reviewed'&&r.review?.reviewer==='ChatGPT'):!(r.review?.status==='reviewed'&&r.review?.reviewer==='ChatGPT')))&&(sub==='all'||r.sub===sub)).sort((a,b)=>b.createdAt-a.createdAt);app.innerHTML=headerHtml()+`<div class="toolbar"><button class="btn secondary" onclick="renderRy()">← Home</button><button class="btn" onclick="exportReviewPacket()">Send Waiting Work to ChatGPT</button><label class="btn secondary" style="cursor:pointer">Import ChatGPT Reviews<input type="file" accept="application/json,.json" onchange="importArchive(this,true)" style="display:none"></label><button class="btn secondary" onclick="exportWrittenArchive()">Backup Full Archive</button><label class="btn secondary" style="cursor:pointer">Restore Full Archive<input type="file" accept="application/json,.json" onchange="importArchive(this,false)" style="display:none"></label></div><section class="card"><div class="eyebrow">Longitudinal writing record</div><h1>ChatGPT Review Queue</h1><p>Riley’s original response is never overwritten. The app preserves the exact prompt, response, date, objective, build, and review history. The webpage does <b>not</b> score writing itself.</p><div class="grid4"><div class="callout"><b>${stats.total}</b><br><small>Total responses</small></div><div class="callout"><b>${stats.awaiting}</b><br><small>Waiting for ChatGPT</small></div><div class="callout"><b>${stats.reviewed}</b><br><small>ChatGPT reviewed</small></div><div class="callout"><b>v${REVIEW_SCHEMA}</b><br><small>Archive schema</small></div></div><div class="callout" style="margin-top:12px"><b>How review works:</b> Export the waiting-work packet and upload it in the Learn With Ry ChatGPT conversation. ChatGPT verifies the current Tennessee rubric/standard, reviews the actual writing, and returns a review file. Import that file here to attach the feedback permanently to the original response.</div><div class="toolbar"><select id="rq_status" onchange="setReviewFilter()"><option value="all" ${status==='all'?'selected':''}>All</option><option value="awaiting_chatgpt" ${status==='awaiting_chatgpt'?'selected':''}>Waiting</option><option value="reviewed" ${status==='reviewed'?'selected':''}>Reviewed</option></select><select id="rq_sub" onchange="setReviewFilter()"><option value="all" ${sub==='all'?'selected':''}>All subjects</option>${Object.entries(SUBJECTS).map(([k,v])=>`<option value="${k}" ${sub===k?'selected':''}>${v.name}</option>`).join('')}</select></div></section>${rows.length?rows.map(reviewCard).join(''):'<section class="card"><p class="muted">No responses match this filter.</p></section>'}`}
function setReviewFilter(){renderReviewQueue(document.getElementById('rq_status')?.value||'all',document.getElementById('rq_sub')?.value||'all')}
function reviewCard(v){let rev=v.review||{},reviewed=rev.status==='reviewed'&&rev.reviewer==='ChatGPT',score=rev.total!=null?` • ${esc(rev.total)}/16`:rev.scoreLabel?` • ${esc(rev.scoreLabel)}`:'';return `<section class="card lesson"><div class="eyebrow">${SUBJECTS[v.sub]?.emoji||'✍️'} ${esc(SUBJECTS[v.sub]?.name||v.sub)} • ${reviewed?'ChatGPT reviewed':'Waiting for ChatGPT'}</div><h3>${esc(v.objectiveTitle||objectiveTitle(v.sub,v.objectiveId))}</h3><p class="muted"><b>Stage:</b> ${esc(v.stage)} • <b>Written:</b> ${new Date(v.createdAt).toLocaleString()} • <b>Build:</b> ${esc(v.buildId||'legacy')}</p><div class="qbox"><b>Prompt</b><br>${esc(v.prompt||promptFor(v.sub,v.objectiveId,v.stage))}</div><div class="qbox"><b>Riley’s response</b><br>${esc(v.text)}</div><div class="source"><b>Review framework:</b> ${esc(v.reviewFramework?.mode||'Tennessee task/standard')} • ${esc(v.reviewFramework?.score||'Verify at review time')}</div>${reviewed?`<div class="callout success"><b>ChatGPT review${score}</b><br>${esc(rev.summary||rev.feedback||'Review imported.')} ${rev.strengths?`<br><b>Strengths:</b> ${esc(Array.isArray(rev.strengths)?rev.strengths.join('; '):rev.strengths)}`:''}${rev.nextStep?`<br><b>Next revision:</b> ${esc(rev.nextStep)}`:''}${rev.rubricSource?`<br><small>Rubric/standard source verified: ${esc(rev.rubricSource)}</small>`:''}</div>`:`<div class="callout warn"><b>Awaiting ChatGPT review.</b> It will remain unscored until a ChatGPT review is imported.</div>`}</section>`}
home();
</script></body></html>
